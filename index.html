<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ecliptalis</title>

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <main class="main-screen">

        <!-- LEFT CONTENT -->
        <section class="main-menu">

            <h1 class="game-title">
                ECLIPTALIS
            </h1>

            <nav class="menu-options" aria-label="Main menu">

                <button class="menu-button" type="button">
                    New Game
                </button>

                <button class="menu-button" type="button">
                    Continue
                </button>

                <button class="menu-button" type="button">
                    Settings
                </button>

            </nav>

        </section>


        <!-- MAIN CHARACTER / ARTWORK -->
        <div class="main-art">
            <img
                src="assets/mainscreen_pic.png"
                alt=""
                draggable="false"
            >
        </div>

    </main>

</body>
</html>
