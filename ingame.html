<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ecliptalis — The Hold</title>

    <link
        rel="stylesheet"
        href="css/ingame_screen.css"
    >

    <link
        rel="stylesheet"
        href="css/ingame_town.css"
    >

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"
        }
    }
    </script>

    <script
        type="module"
        src="js/ingame_screen.js"
    ></script>
</head>


<body class="ingame-body">

<div class="ingame-shell">

    <header
        class="ingame-hud"
        aria-label="Hold status"
    >

        <div class="hud-brand">

            <span
                class="hud-brand-sigil"
                aria-hidden="true"
            >
                ◇
            </span>

            <span class="hud-brand-name">
                ECLIPTALIS
            </span>

        </div>


        <div class="hud-stat">

            <span class="hud-stat-label">
                Town Health
            </span>

            <span
                id="townHealthValue"
                class="hud-stat-value"
            >
                100%
            </span>

        </div>


        <div class="hud-stat">

            <span class="hud-stat-label">
                Food
            </span>

            <span
                id="foodValue"
                class="hud-stat-value"
            >
                0
            </span>

        </div>


        <div class="hud-stat">

            <span class="hud-stat-label">
                Coin
            </span>

            <span
                id="coinValue"
                class="hud-stat-value"
            >
                0
            </span>

        </div>


        <div
            class="hud-stat hud-stat-villagers"
            aria-label="Villager population"
        >

            <span class="hud-stat-label">
                Villagers
            </span>

            <span class="villager-counts">

                <span
                    class="villager-count"
                    aria-label="Male villagers"
                    title="Male villagers"
                >
                    <span aria-hidden="true">♂</span>
                    <strong id="maleVillagerCount">0</strong>
                </span>

                <span class="villager-count-divider">
                    /
                </span>

                <span
                    class="villager-count"
                    aria-label="Female villagers"
                    title="Female villagers"
                >
                    <span aria-hidden="true">♀</span>
                    <strong id="femaleVillagerCount">0</strong>
                </span>

                <span class="villager-count-divider">
                    /
                </span>

                <span
                    class="villager-count villager-count-child"
                    aria-label="Children"
                    title="Children"
                >
                    <span aria-hidden="true">◇</span>
                    <strong id="childVillagerCount">0</strong>
                </span>

            </span>

        </div>

    </header>


    <main
        id="gameWorld"
        class="game-world"
    >

        <div
            id="threeTownMount"
            class="three-town-mount"
            aria-label="Three dimensional view of your Hold"
        >

            <div
                id="townLoading"
                class="town-loading"
            >
                <span class="town-loading-sigil">
                    ◇
                </span>

                <span>
                    Raising your Hold…
                </span>
            </div>

        </div>


        <div
            class="field-vignette"
            aria-hidden="true"
        ></div>


        <div
            class="deployment-ring"
            aria-label="Deployment positions"
        >

            <button
                class="deploy-slot deploy-slot-1"
                type="button"
                data-slot-id="deploy-1"
                data-slot-number="I"
                data-card-id=""
                aria-label="Deployment slot 1"
            >
                <span class="deploy-slot-number">I</span>
                <span class="deploy-slot-mark">+</span>
                <span class="deploy-slot-label">Deploy</span>
            </button>

            <button
                class="deploy-slot deploy-slot-2"
                type="button"
                data-slot-id="deploy-2"
                data-slot-number="II"
                data-card-id=""
                aria-label="Deployment slot 2"
            >
                <span class="deploy-slot-number">II</span>
                <span class="deploy-slot-mark">+</span>
                <span class="deploy-slot-label">Deploy</span>
            </button>

            <button
                class="deploy-slot deploy-slot-3"
                type="button"
                data-slot-id="deploy-3"
                data-slot-number="III"
                data-card-id=""
                aria-label="Deployment slot 3"
            >
                <span class="deploy-slot-number">III</span>
                <span class="deploy-slot-mark">+</span>
                <span class="deploy-slot-label">Deploy</span>
            </button>

            <button
                class="deploy-slot deploy-slot-4"
                type="button"
                data-slot-id="deploy-4"
                data-slot-number="IV"
                data-card-id=""
                aria-label="Deployment slot 4"
            >
                <span class="deploy-slot-number">IV</span>
                <span class="deploy-slot-mark">+</span>
                <span class="deploy-slot-label">Deploy</span>
            </button>

            <button
                class="deploy-slot deploy-slot-5"
                type="button"
                data-slot-id="deploy-5"
                data-slot-number="V"
                data-card-id=""
                aria-label="Deployment slot 5"
            >
                <span class="deploy-slot-number">V</span>
                <span class="deploy-slot-mark">+</span>
                <span class="deploy-slot-label">Deploy</span>
            </button>

            <button
                class="deploy-slot deploy-slot-6"
                type="button"
                data-slot-id="deploy-6"
                data-slot-number="VI"
                data-card-id=""
                aria-label="Deployment slot 6"
            >
                <span class="deploy-slot-number">VI</span>
                <span class="deploy-slot-mark">+</span>
                <span class="deploy-slot-label">Deploy</span>
            </button>

            <button
                class="deploy-slot deploy-slot-7"
                type="button"
                data-slot-id="deploy-7"
                data-slot-number="VII"
                data-card-id=""
                aria-label="Deployment slot 7"
            >
                <span class="deploy-slot-number">VII</span>
                <span class="deploy-slot-mark">+</span>
                <span class="deploy-slot-label">Deploy</span>
            </button>

            <button
                class="deploy-slot deploy-slot-8"
                type="button"
                data-slot-id="deploy-8"
                data-slot-number="VIII"
                data-card-id=""
                aria-label="Deployment slot 8"
            >
                <span class="deploy-slot-number">VIII</span>
                <span class="deploy-slot-mark">+</span>
                <span class="deploy-slot-label">Deploy</span>
            </button>

        </div>


        <aside
            class="ingame-actions"
            aria-label="Game actions"
        >

            <button
                type="button"
                class="ingame-action-button"
                data-game-action="booster"
            >
                Buy Booster
            </button>

            <button
                type="button"
                class="ingame-action-button"
                data-game-action="deck"
            >
                View Deck
            </button>

            <button
                type="button"
                class="ingame-action-button"
                data-game-action="settings"
            >
                Settings
            </button>

            <button
                type="button"
                class="ingame-action-button"
                data-game-action="save-exit"
            >
                Save &amp; Exit
            </button>

        </aside>


        <div
            id="fieldMessage"
            class="field-message"
            role="status"
            aria-live="polite"
        ></div>

    </main>

</div>

</body>

</html>
